
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLEACH LIFE SIMULATOR</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 40%, #14243a 0%, #080b12 55%, #030407 100%);
  color: #f1f4fa;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
    "Hiragino Kaku Gothic ProN", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

main {
  width: 100%;
  max-width: 440px;
  text-align: center;
}

.symbol {
  color: #9bc7ff;
  font-size: 13px;
  letter-spacing: 5px;
  margin-bottom: 24px;
}

h1 {
  font-size: clamp(42px, 12vw, 64px);
  letter-spacing: 7px;
  margin: 0;
  font-weight: 800;
}

.subtitle {
  color: #9bc7ff;
  letter-spacing: 4px;
  font-size: 13px;
  margin-top: 10px;
}

.line {
  height: 1px;
  background: linear-gradient(90deg, transparent, #6389b9, transparent);
  margin: 32px 0;
}

.description {
  color: #bdc8d9;
  line-height: 2;
  font-size: 14px;
  margin-bottom: 28px;
}

label {
  display: block;
  text-align: left;
  color: #9eafc5;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

input {
  width: 100%;
  padding: 16px;
  color: white;
  background: #0e1520;
  border: 1px solid #344a65;
  border-radius: 4px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #91bdff;
  box-shadow: 0 0 14px #477ec533;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 16px;
  background: linear-gradient(110deg, #243d5c, #426b9b);
  color: white;
  border: 1px solid #789ac1;
  border-radius: 4px;
  font-size: 15px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: 0.2s;
}

button:active {
  transform: scale(0.98);
  filter: brightness(1.3);
}

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

.note {
  margin-top: 32px;
  font-size: 10px;
  color: #53657c;
  letter-spacing: 3px;
}

.hidden { display: none; }

#message {
  margin-top: 26px;
  color: #c9ddfa;
  line-height: 2;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.small {
  color: #8394a9;
  font-size: 12px;
  line-height: 1.9;
  margin-top: 18px;
}
</style>
</head>
<body>
<main>
  <section id="start">
    <div class="symbol">SOULS ARE BORN INTO DESTINY</div>
    <h1>BLEACH</h1>
    <div class="subtitle">LIFE SIMULATOR</div>

    <div class="line"></div>

    <p class="description">
      その魂に、どんな運命が待つのか。<br>
      あなたの人生は、ここから始まる。
    </p>

    <form id="birthForm">
      <label for="playerName">YOUR NAME / あなたの名前</label>
      <input
        id="playerName"
        type="text"
        maxlength="20"
        placeholder="名前を入力..."
        autocomplete="off"
        required
      >
      <button type="submit">生 ま れ る</button>
    </form>

    <div class="note">YOUR LIFE. YOUR DESTINY.</div>
  </section>

  <section id="born" class="hidden">
    <div class="symbol">THE RECORD OF A SOUL</div>
    <h1 style="font-size:42px">誕 生</h1>
    <div class="line"></div>
    <p id="message"></p>
    <p class="small">
      これは、あなたの魂の物語の始まりにすぎない。<br>
      次に待つ運命は、まだ誰にもわからない。
    </p>
    <button id="backButton" type="button">名前を変更する</button>
  </section>
</main>

<script>
const form = document.getElementById("birthForm");
const nameInput = document.getElementById("playerName");
const startScreen = document.getElementById("start");
const bornScreen = document.getElementById("born");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const name = nameInput.value.trim();
  if (!name) {
    nameInput.focus();
    return;
  }

  message.textContent =
    name + "。\n\nあなたの魂は、世界に生まれ落ちた。\n\n" +
    "これから歩む人生は、まだ白紙だ。";

  startScreen.classList.add("hidden");
  bornScreen.classList.remove("hidden");
});

document.getElementById("backButton").addEventListener("click", function() {
  bornScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");
  nameInput.focus();
});
</script>
</body>
</html>
